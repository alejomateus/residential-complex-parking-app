<nav
	class="navbar navbar-expand-lg fixed-top"
	[ngClass]="{
		'bg-dark': authData,
		'bg-body-tertiary': !authData
	}"
	[attr.data-bs-theme]="authData ? 'dark' : 'light'"
>
	<div class="container-fluid">
		<a class="navbar-brand" (click)="navigate(authData ? 'user' : 'home')">Residential Complex Parking</a>
		<button
			class="navbar-toggler"
			type="button"
			data-bs-toggle="collapse"
			data-bs-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent"
			aria-expanded="false"
			aria-label="Toggle navigation"
		>
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarSupportedContent">
			@if (authData) {
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					@if (authData.user.role === 'admin' && currentUrl !== 'user') {
						<li class="nav-item">
							<a
								class="nav-link"
								(click)="navigate('admin/user')"
								data-bs-toggle="collapse"
								data-bs-target="#navbarSupportedContent"
								>Usuarios</a
							>
						</li>
						<li class="nav-item">
							<a
								class="nav-link"
								(click)="navigate('admin/parking-spots')"
								data-bs-toggle="collapse"
								data-bs-target="#navbarSupportedContent"
								>Parking Spots</a
							>
						</li>
						<li class="nav-item">
							<a
								class="nav-link"
								(click)="navigate('admin/services')"
								data-bs-toggle="collapse"
								data-bs-target="#navbarSupportedContent"
								>Servicios</a
							>
						</li>
					}
				</ul>
				<div class="navbar-text p-0">
					<ul class="navbar-nav">
						<li class="nav-item">
							<a
								class="nav-link fw-bold"
								data-bs-toggle="collapse"
								data-bs-target="#navbarSupportedContent"
								(click)="signOut()"
								>Cerrar sesión</a
							>
						</li>
					</ul>
				</div>
			}
		</div>
	</div>
</nav>

<ion-app>
	<ion-router-outlet></ion-router-outlet>
</ion-app>

<footer
	class="fixed-bottom p-1"
	[ngClass]="{
		'bg-dark': authData,
		'bg-body-tertiary': !authData
	}"
	[attr.data-bs-theme]="authData ? 'dark' : 'light'"
>
	<div class="container">
		<ion-row>
			<ion-col size="12" class="ion-text-center pt-2">
				<p class="text-muted mb-0">© 2025 Residential Complex Parking - Todos los derechos reservados.</p>
			</ion-col>
		</ion-row>
	</div>
</footer>
