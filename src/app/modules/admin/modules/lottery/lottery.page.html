<ion-content [fullscreen]="true">
	<div class="p-4"></div>
	<ion-grid>
		<ion-row> </ion-row>
		<ion-row>
			<ion-col class="ion-no-padding"></ion-col>
			<ion-col size="12" size-sm="11" size-md="11" size-lg="10">
				<ion-row>
					<ion-col class="ion-text-center">
						@if (!currentLottery?.executionDate) {
						<ion-card>
							<ion-card-header>
								<ion-card-title>Seleccionar Fecha de Reserva</ion-card-title>
							</ion-card-header>

							<ion-card-content>
								<ion-datetime
									[min]="minDate"
									(ionChange)="onDateChange($event)"
									[value]="selectedDate"
									locale="es-ES"
									toggle-icon="chevron-down-circle"
								>
									<span slot="title">Fecha y Hora</span>
								</ion-datetime>
							</ion-card-content>

							<ion-toolbar>
								<ion-buttons slot="start">
									<ion-button color="medium" (click)="cancel()"> Cancelar </ion-button>
								</ion-buttons>

								<ion-buttons slot="end">
									<ion-button color="primary" (click)="confirmDate()" [disabled]="!selectedDate">
										Confirmar
									</ion-button>
								</ion-buttons>
							</ion-toolbar>
						</ion-card>
						} @else {
						<ion-card>
							<ion-card-content>
								<span>Tienes un torneo asignado {{ currentLottery?.executionDate | date:'medium'}}</span>
							</ion-card-content>
						</ion-card>
						}
					</ion-col>
				</ion-row>
			</ion-col>
			<ion-col></ion-col>
		</ion-row>
	</ion-grid>
</ion-content>
